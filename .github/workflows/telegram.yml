name: Traer productos de Telegram

on:
  schedule:
    - cron: '7 23 * * 0,2,4'   # domingo, martes y jueves a las 18:07 en Ecuador (UTC-5), con margen por los retrasos de GitHub
  workflow_dispatch:
    inputs:
      horas:
        description: 'Horas hacia atrás a revisar'
        default: '74'
      paginas:
        description: 'Páginas por canal (más páginas = más historial)'
        default: '25'

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - env:
          MAX_PAGINAS: ${{ github.event.inputs.paginas || '25' }}
        run: python scripts/traer_telegram.py salida "${{ github.event.inputs.horas || '74' }}"
      - name: Guardar en la rama "entrada"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd salida
          git init -q -b entrada
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Entrada $(date -u +%F)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" entrada
