name: Traer productos de Telegram

on:
  schedule:
    - cron: '30 2 * * 1,3,5'   # domingo, martes y jueves a las 21:30 en Ecuador (UTC-5), antes de procesar
  workflow_dispatch:
    inputs:
      horas:
        description: 'Horas hacia atrás a revisar'
        default: '74'

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/traer_telegram.py salida "${{ github.event.inputs.horas || '74' }}"
      - name: Guardar en la rama "entrada"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd salida
          git init -q -b entrada
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Entrada $(date -u +%F)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" entrada
