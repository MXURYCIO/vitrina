name: Textos de Telegram del catálogo

# Baja el texto original de los productos ya publicados, para revisar colores y modelos.
# El resultado se cifra con la llave pública que se pasa al lanzarla y queda un rato en la rama
# "textos-tmp", que se borra después de leerla. Nunca se sube en claro.
on:
  workflow_dispatch:
    inputs:
      llave:
        description: 'Llave pública (PEM en base64) para cifrar el resultado'
        default: ''
      borrar:
        description: 'Escribe "si" para solo borrar la rama textos-tmp después de leerla'
        default: ''
      ids:
        description: 'IDs separados por espacio (vacío = todos)'
        default: ''

permissions:
  contents: write

jobs:
  borrar:
    if: github.event.inputs.borrar == 'si'
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q /tmp/r && cd /tmp/r
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete textos-tmp

  textos:
    if: github.event.inputs.borrar != 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests beautifulsoup4
      - env:
          IDS: ${{ github.event.inputs.ids }}
        run: python scripts/textos_telegram.py /tmp/textos.json $IDS
      - name: Cifrar y dejar en la rama textos-tmp
        env:
          LLAVE: ${{ github.event.inputs.llave }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          echo "$LLAVE" | base64 -d > /tmp/pub.pem
          openssl rand -hex 32 > /tmp/k.txt
          openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.txt -in /tmp/textos.json -out textos.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.txt -out k.enc
          rm -f /tmp/k.txt /tmp/textos.json
          git init -q -b textos-tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Textos cifrados (temporal)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" textos-tmp
